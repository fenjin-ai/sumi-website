{{ with .Params.hero }}
  <section class="hero wrap">
    <div class="hero-copy">
      <div class="eyebrow">
        <span class="ink-dot"></span><span>{{ .eyebrow }}</span>
      </div>
      <h1><span>{{ .title }}</span><br /><em>{{ .emphasis }}</em></h1>
      <p class="intro">{{ .description }}</p>
      <div class="hero-actions">
        {{ partial "download.html" (dict "class" "button primary") }}<a
          class="text-link"
          href="#possibilities"
          >{{ T "see-what-you-can-make" }}</a
        >
      </div>
      <p class="availability">{{ T "nightly-note" }}</p>
    </div>
    <figure
      class="hero-art"
      aria-label="{{ T "hero-art-label" }}"
      data-paper-art
    >
      <span class="art-orbit" aria-hidden="true"></span
      ><span class="art-cross art-cross-one" aria-hidden="true">+</span
      ><span class="art-cross art-cross-two" aria-hidden="true">+</span>
      <img
        class="art-report"
        src="/assets/works/03-report.{{ site.Language.Params.imageLocale }}.webp"
        width="1000"
        height="1414"
        alt="{{ .reportAlt }}"
      />
      <img
        class="art-poster"
        src="/assets/works/06-poster.{{ site.Language.Params.imageLocale }}.webp"
        width="1000"
        height="1414"
        alt="{{ .posterAlt }}"
        fetchpriority="high"
      />
      <img
        class="art-slide"
        src="/assets/works/04-slides.{{ site.Language.Params.imageLocale }}.webp"
        width="1000"
        height="562"
        alt="{{ .slideAlt }}"
      />
      <span class="art-label label-top" aria-hidden="true"
        >{{ .artworkLabel }}</span
      >
      <figcaption class="art-label label-bottom" aria-hidden="true">
        <span class="label-rule"></span><span>{{ .artworkCaption }}</span>
      </figcaption>
    </figure>
  </section>
{{ end }}
